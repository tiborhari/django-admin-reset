[tox]
envlist =
    py{310,311,312,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314}-django61
    docs
    package

[testenv]
pip_pre = True
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands =
    pip install -e .[testing]
    pytest
    flake8

[testenv:docs]
basepython = python3.13
commands =
    pip install -e .[docs]
    sphinx-build -W -b html -d {envtmpdir}/doctrees docs docs/_build

[testenv:package]
basepython = python3.13
commands =
    pip install build setuptools -e .[babel]
    pybabel compile --domain django --directory django_admin_reset/locale
    python -m build

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313, docs, package
    3.14: py314

[pytest]
DJANGO_SETTINGS_MODULE = django_admin_reset.tests.settings
addopts = --cov=django_admin_reset
filterwarnings = error
testpaths = django_admin_reset/tests

[coverage:run]
branch = True
omit = django_admin_reset/tests/*
source = django_admin_reset

[flake8]
exclude =
    .tox
    build
    venv
